<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Expense Planner</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--bd:#e3e1da;--ac:#0f766e;--ok:#0f766e;--wn:#b45309;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1f1f1d;--tx:#efeee9;--mu:#a09f98;--bd:#33322e;--ac:#2dd4bf;--ok:#2dd4bf;--wn:#f59e0b;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#151514;--card:#1f1f1d;--tx:#efeee9;--mu:#a09f98;--bd:#33322e;--ac:#2dd4bf;--ok:#2dd4bf;--wn:#f59e0b;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,button{font:inherit}
input,select{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;width:100%}
.ghost{background:none;border:0;color:var(--mu);cursor:pointer;padding:4px 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:18px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd);gap:8px}
.item:first-child{border-top:0}
.mu{color:var(--mu);font-size:13px}
.donut{width:150px;height:150px;border-radius:50%;margin:0 auto 10px;position:relative}
.donut:after{content:"";position:absolute;inset:32px;background:var(--card);border-radius:50%}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;justify-content:center}
.leg span i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;text-align:right;border-top:1px solid var(--bd)}
td:first-child,th:first-child{text-align:left}
.up{color:var(--bad)}.dn{color:var(--ok)}
.nd{display:grid;grid-template-columns:1fr 100px auto;gap:6px;margin-top:8px}
</style>
</head>
<body>
<div class="w">
<h1>Monthly Expense Planner</h1>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<p class="mu">Data is saved in this browser on this device only.</p>
</div>
<script>
const COLORS=['#0f766e','#2563eb','#c026d3','#ea580c','#ca8a04','#16a34a','#dc2626','#7c3aed','#0891b2','#64748b','#be185d','#65a30d'];
const KEY='expense-planner-v1';
let S={cats:['Food','Travel','Study','Rent','Bills','Shopping','Health','Fun','Other'].map(n=>({name:n,budget:0})),exp:[]};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.cats&&p.exp)S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=new Date().toISOString().slice(0,10);
let tab='log',month=today.slice(0,7),cmpA=prevMonth(month),cmpB=month;
function prevMonth(m){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function totals(m){const t={};S.exp.filter(e=>e.date.startsWith(m)).forEach(e=>t[e.cat]=(t[e.cat]||0)+e.amt);return t}
function sum(o){return Object.values(o).reduce((a,b)=>a+b,0)}
function names(extra){const n=S.cats.map(c=>c.name);Object.keys(extra).forEach(k=>{if(!n.includes(k))n.push(k)});return n}

function drawTabs(){
 document.getElementById('tabs').innerHTML=[['log','Log'],['budget','Budgets'],['compare','Compare']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('');
}
function monthPick(id,val,fn){return `<input type="month" id="${id}" value="${val}" onchange="${fn}(this.value)">`}
function setMonth(v){if(v){month=v;draw()}}

function viewLog(){
 const t=totals(month),spent=sum(t),bud=S.cats.reduce((a,c)=>a+(+c.budget||0),0);
 const list=S.exp.filter(e=>e.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 const left=bud-spent;
 let h=`<div class="card"><h2>Add expense</h2>
 <div class="row"><input type="date" id="d" value="${month===today.slice(0,7)?today:month+'-01'}"><input type="number" id="a" inputmode="decimal" placeholder="Amount (₹)" min="0"></div>
 <div class="row"><select id="c">${S.cats.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><input id="n" placeholder="Note (optional)"></div>
 <button class="btn" onclick="addExp()">Add</button></div>
 <div style="margin-bottom:8px">${monthPick('m',month,'setMonth')}</div>
 <div class="kpis"><div class="kpi"><small>Spent</small><b>${inr(spent)}</b></div><div class="kpi"><small>Budget</small><b>${bud?inr(bud):'-'}</b></div><div class="kpi"><small>${left<0?'Over by':'Left'}</small><b class="${left<0?'up':''}">${bud?inr(Math.abs(left)):'-'}</b></div></div>
 <div class="card" style="margin-top:12px"><h2>Where it went</h2>`;
 const ns=names(t).filter(n=>t[n]>0);
 if(!spent)h+=`<p class="mu">No expenses logged for this month yet.</p>`;
 else{let a=0;const seg=ns.map((n,i)=>{const s=a,e=a+t[n]/spent*100;a=e;return `${COLORS[i%12]} ${s}% ${e}%`}).join(',');
  h+=`<div class="donut" style="background:conic-gradient(${seg})"></div><div class="leg">${ns.map((n,i)=>`<span><i style="background:${COLORS[i%12]}"></i>${esc(n)} ${Math.round(t[n]/spent*100)}%</span>`).join('')}</div>`}
 h+=`</div><div class="card"><h2>Budget vs spent</h2>`;
 const withB=names(t).filter(n=>t[n]||(S.cats.find(c=>c.name===n)||{}).budget>0);
 h+=withB.length?withB.map(n=>{const b=+(S.cats.find(c=>c.name===n)||{}).budget||0,s=t[n]||0,p=b?Math.min(100,s/b*100):0,col=!b?'var(--ac)':s>b?'var(--bad)':s>b*.8?'var(--wn)':'var(--ok)';
  return `<div style="margin-bottom:10px"><div class="item" style="border:0;padding:0"><span>${esc(n)}</span><span class="mu">${inr(s)}${b?' / '+inr(b):''}</span></div><div class="bar"><i style="width:${b?p:(spent?s/spent*100:0)}%;background:${col}"></i></div></div>`}).join(''):`<p class="mu">Nothing to show yet.</p>`;
 h+=`</div><div class="card"><h2>Expenses (${list.length})</h2>`;
 h+=list.length?list.map(e=>`<div class="item"><div><b>${inr(e.amt)}</b> · ${esc(e.cat)}<div class="mu">${e.date}${e.note?' · '+esc(e.note):''}</div></div><button class="ghost" onclick="delExp(${e.id})">✕</button></div>`).join(''):`<p class="mu">Empty.</p>`;
 return h+'</div>';
}
function addExp(){
 const amt=parseFloat(document.getElementById('a').value),date=document.getElementById('d').value;
 if(!(amt>0)||!date){alert('Enter a date and an amount above 0');return}
 S.exp.push({id:Date.now(),date,amt,cat:document.getElementById('c').value,note:document.getElementById('n').value.trim()});
 save();month=date.slice(0,7);draw();
}
function delExp(id){S.exp=S.exp.filter(e=>e.id!==id);save();draw()}

function viewBudget(){
 return `<div class="card"><h2>Categories and monthly budgets</h2>`+S.cats.map((c,i)=>`<div class="item"><span style="flex:1">${esc(c.name)}</span><input type="number" style="width:110px" min="0" value="${c.budget||''}" placeholder="₹ budget" onchange="S.cats[${i}].budget=+this.value||0;save()"><button class="ghost" onclick="delCat(${i})">✕</button></div>`).join('')+
 `<div class="nd"><input id="nc" placeholder="New category"><input id="nb" type="number" min="0" placeholder="₹ budget"><button class="btn" onclick="addCat()">Add</button></div></div>
 <p class="mu">Removing a category keeps its past expenses; they still show in totals.</p>`;
}
function addCat(){const n=document.getElementById('nc').value.trim();if(!n||S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase()))return;S.cats.push({name:n,budget:+document.getElementById('nb').value||0});save();draw()}
function delCat(i){if(confirm('Remove "'+S.cats[i].name+'"?')){S.cats.splice(i,1);save();draw()}}

function viewCompare(){
 const A=totals(cmpA),B=totals(cmpB),ns=names({...A,...B}).filter(n=>A[n]||B[n]),ta=sum(A),tb=sum(B);
 const dl=(a,b)=>{const d=b-a;return d===0?'<span class="mu">0</span>':`<span class="${d>0?'up':'dn'}">${d>0?'+':'−'}${inr(Math.abs(d))}</span>`};
 return `<div class="card"><h2>Compare two months</h2><div class="row"><input type="month" value="${cmpA}" onchange="cmpA=this.value||cmpA;draw()"><input type="month" value="${cmpB}" onchange="cmpB=this.value||cmpB;draw()"></div>
 <div class="scroll"><table><tr><th>Category</th><th>${cmpA}</th><th>${cmpB}</th><th>Change</th></tr>`+
 ns.map(n=>`<tr><td>${esc(n)}</td><td>${inr(A[n]||0)}</td><td>${inr(B[n]||0)}</td><td>${dl(A[n]||0,B[n]||0)}</td></tr>`).join('')+
 `<tr><td><b>Total</b></td><td><b>${inr(ta)}</b></td><td><b>${inr(tb)}</b></td><td><b>${dl(ta,tb)}</b></td></tr></table></div>
 ${ns.length?'':'<p class="mu">No expenses in either month.</p>'}</div>`;
}
function draw(){drawTabs();document.getElementById('app').innerHTML=tab==='log'?viewLog():tab==='budget'?viewBudget():viewCompare()}
draw();
</script>
 <script src='https://www.noupe.com/embed/01a12a2715d870008ffbdba1037c30a63cf2.js'></script>
</body>
</html>
